# 3D Xiangqi — Nginx reverse proxy.
# Handles SSL termination on 443 and forwards WebSocket Upgrade requests to the
# internal Spring Boot / Node container on port 8080.
#
# Replace $DOMAIN with your real domain before enabling TLS. Certbot manages the
# certificate paths under /etc/letsencrypt (see deploy/deploy.sh).

# HTTP -> HTTPS redirect (with ACME challenge passthrough for Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS + WebSocket
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Static + REST
    location / {
        proxy_pass         http://xq_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # STOMP-over-WebSocket — keep the connection alive and pass the Upgrade header.
    location /ws {
        proxy_pass         http://xq_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
