# 3D Xiangqi — service topology (matches the spec's deployment contract).
#   xq_postgres    : match history / Elo ladder (used by xq_backend_java)
#   xq_redis       : room state / pub-sub (used by xq_backend_java)
#   xq_backend     : the Node mock backend serving the SPA + STOMP WebSocket
#   xq_backend_java: Spring Boot backend (drop-in replacement) — A/B on port 8081
#
# Bring up with:  docker compose -f deploy/docker-compose.yml up -d --build
# Java only:      docker compose -f deploy/docker-compose.yml up -d --build xq_backend_java
name: xiangqi

services:
  xq_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xiangqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xiangqi}
      POSTGRES_DB: ${POSTGRES_DB:-xiangqi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xiangqi} -d ${POSTGRES_DB:-xiangqi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  xq_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-xiangqi}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-xiangqi}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  xq_backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: node-runtime
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      # Consumed by the Spring backend; harmless to the Node mock.
      DATABASE_URL: postgres://${POSTGRES_USER:-xiangqi}:${POSTGRES_PASSWORD:-xiangqi}@xq_postgres:5432/${POSTGRES_DB:-xiangqi}
      REDIS_URL: redis://:${REDIS_PASSWORD:-xiangqi}@xq_redis:6379
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      xq_postgres:
        condition: service_healthy
      xq_redis:
        condition: service_healthy

  # Spring Boot backend — identical wire contract to xq_backend, so the frontend
  # works against either. Runs side-by-side on BACKEND_PORT_JAVA for A/B checks.
  # Persists matches + the Elo ladder in PostgreSQL and room state / pub-sub in
  # Redis (both hard requirements at runtime). Replicas pointed at the same
  # Redis share rooms, so multiple instances can sit behind one L7 proxy.
  xq_backend_java:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: java-runtime
    # Stable DNS name for hobbyland's caddy (chinese.jackstudio.app →
    # https://xiangqi-app:8080 over the shared-proxy network).
    container_name: xiangqi-app
    restart: unless-stopped
    environment:
      PORT: "8080"
      XQ_STATIC_ROOT: /app/static
      # App-served self-signed TLS (deploy/ensure-certs.sh provisions the pair).
      # Override with HTTPS=false in the caller environment or deploy/.env.
      HTTPS: ${HTTPS:-true}
      SSL_CERT_PATH: /certs/cert.pem
      SSL_KEY_PATH: /certs/key.pem
      SPRING_DATASOURCE_URL: jdbc:postgresql://xq_postgres:5432/${POSTGRES_DB:-xiangqi}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-xiangqi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-xiangqi}
      REDIS_HOST: xq_redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-xiangqi}
    ports:
      # Loopback-only: public traffic arrives via hobbyland's caddy over the
      # shared-proxy docker network, never through this host port.
      - "127.0.0.1:${BACKEND_PORT_JAVA:-8081}:8080"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      xq_postgres:
        condition: service_healthy
      xq_redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
