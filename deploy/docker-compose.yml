# 3D Xiangqi — service topology (matches the spec's deployment contract).
#   xq_postgres : match history / users (used by the future Spring backend)
#   xq_redis    : room state / pub-sub (used by the future Spring backend)
#   xq_backend  : the Node mock backend serving the SPA + STOMP WebSocket
#
# Bring up with:  docker compose -f deploy/docker-compose.yml up -d --build
name: xiangqi

services:
  xq_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xiangqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xiangqi}
      POSTGRES_DB: ${POSTGRES_DB:-xiangqi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xiangqi} -d ${POSTGRES_DB:-xiangqi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  xq_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-xiangqi}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-xiangqi}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  xq_backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      # Consumed by the future Spring backend; harmless to the Node mock.
      DATABASE_URL: postgres://${POSTGRES_USER:-xiangqi}:${POSTGRES_PASSWORD:-xiangqi}@xq_postgres:5432/${POSTGRES_DB:-xiangqi}
      REDIS_URL: redis://:${REDIS_PASSWORD:-xiangqi}@xq_redis:6379
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      xq_postgres:
        condition: service_healthy
      xq_redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
