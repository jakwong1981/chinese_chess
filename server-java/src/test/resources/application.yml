# Test profile: embedded H2 (PostgreSQL mode) so the suite runs without Docker.
# Runtime still hard-requires a real datasource — this file only applies to tests.
spring:
  datasource:
    url: jdbc:h2:mem:xq;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

xiangqi:
  ratings-file: ${java.io.tmpdir}/xq-no-such-legacy-ratings.json
  # Single-process room state + in-process event bus: the suite stays Docker-free.
  cluster:
    mode: memory
